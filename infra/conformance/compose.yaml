# The odudu side of a conformance run: postgres, the server, and a TLS
# proxy in front of it, all on the shared `odudu-conformance` network
# where the OpenID Foundation suite (brought up separately by
# suite-compose.yaml, see README.md) can reach them by name. Not for
# anything but a conformance run — every credential here is a disposable
# placeholder that lives only for the run's duration.
networks:
  default:
    name: odudu-conformance
    external: true

services:
  postgres:
    # digest of the multi-arch index; Dependabot moves it
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: odudu
      POSTGRES_PASSWORD: odudu
      POSTGRES_DB: odudu
      ODUDU_SVC_PASSWORD: odudu_svc
    volumes:
      - ../docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odudu -d odudu']
      interval: 2s
      timeout: 3s
      retries: 30

  odudu:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      ODUDU_DATABASE_URL: postgres://odudu:odudu@postgres:5432/odudu
      ODUDU_APP_DATABASE_URL: postgres://odudu_svc:odudu_svc@postgres:5432/odudu
      ODUDU_LOG_LEVEL: info
      # Not the compose stack's example key: this stack runs production, which
      # refuses that one.
      ODUDU_KEK: KysrKysrKysrKysrKysrKysrKysrKysrKysrKysrKys=
      # Made for each run by the script that starts it
      # (../docker/console-key.sh): a private key is never committed.
      ODUDU_CONSOLE_CLIENT_KEY: ${ODUDU_CONSOLE_CLIENT_KEY:?start this stack with a run-*.sh script}
      # A conformance run always sits behind proxy's TLS termination — see
      # README.md's answer to whether a Config OP plan accepts http://.
      ODUDU_TLS: 'true'
      ODUDU_TRUST_PROXY: 'true'
      # The origin the suite actually reaches this server on: the proxy
      # container, by its service name `proxy`, on 443, so no port. It is
      # also the issuer every tenant states, so it must be the host the plan
      # files fetch discovery from (config-op.json and its siblings). Required because this stack
      # runs the image's NODE_ENV=production, where the boot guard in
      # apps/server/src/config-guard.ts refuses to serve without a WebAuthn
      # relying party id to derive. Change proxy/nginx.conf's server_name
      # and the plan files with it — they name the same host.
      ODUDU_PUBLIC_BASE_URL: https://proxy
      # The whole suite arrives from one address — proxy's — so the default
      # per-origin budget of ten login submissions a minute would refuse
      # test modules rather than protect anything. Generous rather than
      # effectively unlimited, so the mechanism still runs and a window
      # that stopped sliding would still eventually show up here.
      ODUDU_THROTTLE_LIMIT: '5000'
      # The suite signs in as a handful of users over and over, so the
      # per-username budget is the one it meets first. Raised for the same
      # reason, and as far.
      ODUDU_LOGIN_THROTTLE_LIMIT: '5000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  proxy:
    build: ./proxy
    depends_on:
      odudu:
        condition: service_healthy
    ports:
      - '127.0.0.1:8543:443'
