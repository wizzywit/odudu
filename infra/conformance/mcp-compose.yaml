# The stack run-mcp.sh drives real MCP clients against: postgres and the
# server, plain HTTP on a loopback port. Every credential is a disposable
# placeholder that lives for the run. The server runs NODE_ENV=development
# because it serves http, as infra/docker/compose.yaml does; the production
# configuration behind TLS is compose.yaml's.
services:
  postgres:
    # digest of the multi-arch index; Dependabot moves it
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: odudu
      POSTGRES_PASSWORD: odudu
      POSTGRES_DB: odudu
      ODUDU_SVC_PASSWORD: odudu_svc
    volumes:
      - ../docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odudu -d odudu']
      interval: 2s
      timeout: 3s
      retries: 30

  odudu:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      NODE_ENV: development
      ODUDU_DATABASE_URL: postgres://odudu:odudu@postgres:5432/odudu
      ODUDU_APP_DATABASE_URL: postgres://odudu_svc:odudu_svc@postgres:5432/odudu
      ODUDU_LOG_LEVEL: info
      ODUDU_KEK: KysrKysrKysrKysrKysrKysrKysrKysrKysrKysrKys=
      ODUDU_CONSOLE_CLIENT_KEY: ${ODUDU_CONSOLE_CLIENT_KEY:?start this stack with run-mcp.sh}
      # The origin every tenant states as its issuer and the MCP endpoint's
      # Host check compares against: the port run-mcp.sh publishes.
      ODUDU_PUBLIC_BASE_URL: http://localhost:${ODUDU_MCP_PORT:?start this stack with run-mcp.sh}
      # One address signs in for every client the run registers.
      ODUDU_THROTTLE_LIMIT: '10000'
      ODUDU_LOGIN_THROTTLE_LIMIT: '10000'
      ODUDU_REAP_ENABLED: 'false'
      ODUDU_OUTBOX_ENABLED: 'false'
      ODUDU_LOGOUT_SENDER_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    ports:
      - '127.0.0.1:${ODUDU_MCP_PORT}:3000'
