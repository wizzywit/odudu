server {
    # The default HTTPS port, deliberately: Fastify's request.hostname
    # (read via trustProxy off X-Forwarded-Host) drops the port whenever
    # the Host header carries a non-default one, which would make every
    # URL in the discovery document wrong on any other port. Listening on
    # 443 means the Host header the suite sends never carries a port to
    # begin with, so the same code that will eventually need that fix
    # never has to be touched by this conformance run. See README.md.
    listen 443 ssl;
    server_name odudu;

    ssl_certificate     /etc/nginx/conformance.crt;
    ssl_certificate_key /etc/nginx/conformance.key;

    # Preserves the client-visible scheme and host so odudu's issuer and
    # __Host- cookie logic (ODUDU_TRUST_PROXY) see https, not the plain
    # HTTP this proxy speaks to the odudu container over.
    location / {
        proxy_pass http://odudu:3000;
        # $http_host (not $host) so the port survives — $host strips it,
        # and odudu's issuer/hostname come straight from this Host header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8443;
    }
}
