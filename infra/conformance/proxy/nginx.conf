server {
    # The default HTTPS port: the Host header the suite sends then carries
    # no port at all, which is the simplest thing for the issuer to echo.
    # A non-default port works too — the issuer is built from
    # request.host, which keeps it (see
    # packages/protocol-oidc/src/view/issuer.ts).
    listen 443 ssl;
    server_name odudu;

    ssl_certificate     /etc/nginx/conformance.crt;
    ssl_certificate_key /etc/nginx/conformance.key;

    # Preserves the client-visible scheme and host so odudu's issuer and
    # __Host- cookie logic (ODUDU_TRUST_PROXY) see https, not the plain
    # HTTP this proxy speaks to the odudu container over.
    location / {
        proxy_pass http://odudu:3000;
        # $http_host (not $host) so the port survives — $host strips it,
        # and odudu's issuer/hostname come straight from this Host header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # $remote_addr, not $proxy_add_x_forwarded_for: appending leaves a
        # client-supplied value in front of the real one, and with
        # ODUDU_TRUST_PROXY on that is the address request.ip reports and
        # the per-origin throttle is keyed on (ADR 0023). Overwriting is
        # what a proxy in front of Odudu has to do.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8443;
        # This proxy terminates no client certificate — the suite never
        # presents one — but ODUDU_TRUST_PROXY is on for the reasons
        # above, and that flag also gates tls_client_auth client
        # authentication (README.md's deployment section). Nginx forwards
        # an unrecognized inbound header by default, so without this a
        # caller could set the header itself and have it reach odudu
        # verbatim. Cleared, not merely unset, for the same reason
        # X-Forwarded-For above is overwritten rather than appended to.
        proxy_set_header X-SSL-Client-S-DN "";
    }
}
