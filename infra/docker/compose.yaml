# Local development only. Do not deploy this file, or any variant of it,
# to a shared or public environment. Requires infra/docker/.env (copy
# infra/docker/.env.example) — with no defaults here, the stack cannot
# start until you supply values. Both published ports are bound to
# loopback regardless of what those values are; if you change that, you
# are publishing Postgres and the app server to the network.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?see infra/docker/.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see infra/docker/.env.example}
      POSTGRES_DB: ${POSTGRES_DB:?see infra/docker/.env.example}
      ODUDU_SVC_PASSWORD: ${ODUDU_SVC_PASSWORD:?see infra/docker/.env.example}
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      # Host-side port only: the container listens on 5432, but the host
      # commonly already has a native postgres bound to 5432, so the
      # published port is moved rather than changing the in-container port
      # (which every other service in this file addresses by its default).
      - '127.0.0.1:5442:5432'

  odudu:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      # The image sets NODE_ENV=production; this stack serves plain HTTP on
      # loopback, so it says otherwise rather than setting ODUDU_TLS=true and
      # lying to the boot guard that refuses plaintext production traffic
      # (apps/server/src/config-guard.ts). infra/conformance/compose.yaml is
      # the stack that runs the production configuration, behind real TLS.
      NODE_ENV: development
      ODUDU_DATABASE_URL: postgres://${POSTGRES_USER:?see infra/docker/.env.example}:${POSTGRES_PASSWORD:?see infra/docker/.env.example}@postgres:5432/${POSTGRES_DB:?see infra/docker/.env.example}
      ODUDU_APP_DATABASE_URL: postgres://odudu_svc:${ODUDU_SVC_PASSWORD:?see infra/docker/.env.example}@postgres:5432/${POSTGRES_DB:?see infra/docker/.env.example}
      ODUDU_LOG_LEVEL: info
      ODUDU_KEK: ${ODUDU_KEK:?see infra/docker/.env.example}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    ports:
      - '127.0.0.1:3000:3000'
