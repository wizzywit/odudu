# Extra containers for trying the console by hand, layered over compose.yaml:
#   docker compose -f compose.yaml -f compose.try.yaml up -d --build
# Nothing here runs in any other stack. Each service is reachable from the
# server on a private address, which ODUDU_ALLOW_PRIVATE_* admits below.
services:
  odudu:
    environment:
      ODUDU_ALLOW_PRIVATE_SMTP_HOSTS: 'true'
      ODUDU_ALLOW_PRIVATE_CLIENT_URLS: 'true'
      # The deployment's own sender: verification and reset mail lands in
      # Mailpit. A tenant's relay (Email page) can name the same host.
      ODUDU_SMTP_HOST: mailpit
      ODUDU_SMTP_PORT: '1025'
      ODUDU_SMTP_FROM: odudu@try.local
      ODUDU_SMTP_STARTTLS: 'false'
      # The logout sink's own certificate, so back-channel logout (https only)
      # can be delivered to it.
      NODE_EXTRA_CA_CERTS: /etc/odudu-try/logout-sink.pem
    volumes:
      - ./try-certs/logout-sink.pem:/etc/odudu-try/logout-sink.pem:ro

  # Catches every message sent to it; read them at http://localhost:8090.
  mailpit:
    # digest of the multi-arch index; Dependabot moves it
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - '127.0.0.1:8090:8025'

  # Prints every request it receives, as JSON, in its logs: a target for a
  # client's back-channel logout URI (https://logout-sink:8443/).
  # Run ./try-certs.sh once before `up`.
  logout-sink:
    image: mendhak/http-https-echo:43@sha256:c4a81744e620ad3cfbffa97374c9c0e545bb3d132b07ebc7745cce6ddee745a1
    environment:
      HTTP_PORT: '8080'
      HTTPS_PORT: '8443'
      HTTPS_CERT_FILE: /app/fullchain.pem
      HTTPS_KEY_FILE: /app/privkey.pem
    volumes:
      - ./try-certs/logout-sink.pem:/app/fullchain.pem:ro
      - ./try-certs/logout-sink.key:/app/privkey.pem:ro
    ports:
      - '127.0.0.1:8091:8443'
