# Answers on port 80 for any host and hands the request to the server with the
# Host header untouched, so a verified domain such as login.acme-live.lvh.me
# reaches its tenant as it would behind a real proxy.
server {
  listen 80 default_server;
  location / {
    proxy_pass http://odudu:3000;
    proxy_set_header Host $http_host;
  }
}
