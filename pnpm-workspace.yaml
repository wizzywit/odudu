packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
  - 'tests'
# A newly published package version is more likely to be compromised
# (supply-chain attacks are typically pulled within hours of publish) or
# simply broken. 1440 minutes (24h) gives the ecosystem time to notice
# before we install it.
minimumReleaseAge: 1440
allowBuilds:
  '@swc/core': false
  core-js: false
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@types/node@24.13.4'
  - zod@4.6.1
# @node-rs/argon2 ships a native .node binary as a platform-specific optional
# dependency of packages/domain-identity, not of the workspace root or of
# @odudu/server. pnpm's isolated linker would otherwise nest it under
# packages/domain-identity/node_modules — several directories below where
# Node's module resolution looks from a file under an image's /app — so a
# bare `import '@node-rs/argon2'` couldn't resolve there without a
# hand-written symlink. Hoisting it (and its per-platform sibling package)
# to the root node_modules is what lets it resolve on its own. sharp (image
# decoding in packages/domain-theme) and its @img binaries are hoisted for the
# same reason.
# verified: on this repo's pinned pnpm (12.3.4), this setting is read from
# pnpm-workspace.yaml, not .npmrc — a plain .npmrc `public-hoist-pattern`
# was silently ignored for workspace installs (confirmed empty
# `publicHoistPattern` in the resulting node_modules/.modules.yaml).
publicHoistPattern:
  - '@node-rs/argon2*'
  - sharp
  - '@img/*'

# @lhci/cli's puppeteer-core pulls chromium-bidi, which declares zod 3. The
# console holds the lockfile to the one zod it validates with (the contracts'
# pin). verified: `lhci collect` and `lhci assert` run with zod 4 here; they
# drive Chrome over CDP, and chromium-bidi is the WebDriver BiDi client.
overrides:
  'chromium-bidi>zod': 4.6.7
