name: verify

# `pull_request` exists only to gate fork PRs: a fork's push never reaches
# this repo's Actions, so without it a fork PR gets no CI at all. For a
# same-repo branch the push event already covers the commit, so the job
# below skips the pull_request run in that case — the concurrency group
# cannot dedupe them, since a push and a pull_request for the same commit
# land in different groups and both would run to completion.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Same-repo pull requests are already covered by their push event.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  container:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # smoke.sh fails closed if infra/docker/.env is missing (ADR 0015) —
      # this is the deliberate act CI performs in its place.
      - name: Bootstrap infra/docker/.env
        run: cp infra/docker/.env.example infra/docker/.env

      - name: Build and smoke-test the stack
        run: ./infra/docker/smoke.sh

  commit-messages:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check reads commit messages, so it needs real history.
          fetch-depth: 0
      - name: Reject tool-attribution trailers
        run: |
          if git log --format=%B origin/main..HEAD |
             grep -inE 'co-authored-by:.*(claude|anthropic)|generated with .*(claude|anthropic)|🤖'; then
            echo "::error::A commit message carries a tool-attribution trailer. See .githooks/commit-msg" >&2
            exit 1
          fi
          echo "commit messages clean"
