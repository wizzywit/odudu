name: verify

# Runs on pull requests, and on pushes to main after a merge. A branch push
# with no pull request open gets nothing on purpose: gating at the pull
# request is what makes fork contributions safe (a fork's push never reaches
# this repo's Actions), and triggering on both would run every check twice
# under different concurrency groups, leaving phantom skipped checks on the
# pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # smoke.sh fails closed if infra/docker/.env is missing (ADR 0015) —
      # this is the deliberate act CI performs in its place.
      - name: Bootstrap infra/docker/.env
        run: cp infra/docker/.env.example infra/docker/.env

      - name: Build and smoke-test the stack
        run: ./infra/docker/smoke.sh

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache the conformance suite's Maven repository
        uses: actions/cache@v4
        with:
          path: /tmp/conformance-m2
          key: conformance-suite-m2-release-v5.1.36

      - name: Run the Config OP conformance plan
        run: ./infra/conformance/run-config-op.sh
        env:
          MAVEN_CACHE: /tmp/conformance-m2

  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check reads commit messages, so it needs real history.
          fetch-depth: 0
      - name: Reject tool-attribution trailers
        run: |
          if git log --format=%B origin/main..HEAD |
             grep -inE 'co-authored-by:.*(claude|anthropic)|generated with .*(claude|anthropic)|🤖'; then
            echo "::error::A commit message carries a tool-attribution trailer. See .githooks/commit-msg" >&2
            exit 1
          fi
          echo "commit messages clean"
