name: verify

# `pull_request` gates fork PRs: a fork's push event never reaches this
# repo's Actions runs, so without it a fork PR got no CI at all. For a
# same-repo branch both `push` and `pull_request` now fire for the same
# commit; the concurrency group below keys on the PR number when one
# exists so the push-triggered run for that commit is canceled in favor of
# the pull_request-triggered one, rather than both running to completion.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test the stack
        run: ./infra/docker/smoke.sh
