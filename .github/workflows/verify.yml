name: verify

# Runs on pull requests, and on pushes to main after a merge. A branch push
# with no pull request open gets nothing on purpose: gating at the pull
# request is what makes fork contributions safe (a fork's push never reaches
# this repo's Actions), and triggering on both would run every check twice
# under different concurrency groups, leaving phantom skipped checks on the
# pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # smoke.sh fails closed if infra/docker/.env is missing (ADR 0015) —
      # this is the deliberate act CI performs in its place.
      - name: Bootstrap infra/docker/.env
        run: cp infra/docker/.env.example infra/docker/.env

      - name: Build and smoke-test the stack
        run: ./infra/docker/smoke.sh

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache the conformance suite's Maven repository
        uses: actions/cache@v6
        with:
          path: /tmp/conformance-m2
          key: conformance-suite-m2-release-v5.1.36

      - name: Run the Config OP conformance plan
        run: ./infra/conformance/run-config-op.sh
        env:
          MAVEN_CACHE: /tmp/conformance-m2

  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check reads commit messages, so it needs real history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The same checker .githooks/commit-msg runs, over every commit the
      # branch adds — so a clone that never ran `git config core.hooksPath`
      # is held to the rules too. No install: it imports nothing but Node.
      - name: Check commit messages
        run: |
          status=0
          for sha in $(git rev-list origin/main..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/commit-message
            if ! node tools/commit-message/src/index.ts --stored /tmp/commit-message; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")" >&2
              status=1
            fi
          done
          exit $status
