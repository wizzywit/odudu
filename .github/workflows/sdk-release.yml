name: sdk-release

# Publishes one SDK when a tag like oidc-v0.1.0 or python-v0.1.0-rc.1 is
# pushed: the packages under sdks/ go to npm as @odudu-io/<name> (the tag's
# name is the directory), and sdks/python goes to PyPI as `odudu`. RELEASING.md
# says how to cut one and what the owner sets up once.
#
# Run by hand, with a tag as input, it does everything except publish: the tag
# is checked, the package is built, tested and packed, and nothing reaches a
# registry. The publish jobs also run behind the `sdk-release` environment, so
# the owner can require an approval before a registry sees anything.
#
# Neither registry gets a token. Both accept this workflow's own OIDC identity
# (trusted publishing), which only the publish jobs may request.
on:
  push:
    tags: ['*-v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build without publishing, such as oidc-v0.1.0-rc.1. CHANGELOG.md of the package must have a section for its version.
        required: true
        default: oidc-v0.1.0-rc.1

permissions: {}

# A manual run never publishes: the publish jobs run on a push of a tag only.
# The gate check is read for $GITHUB_SHA, the commit that tag points at, by
# design, so a manual run (which skips that check) needs no CI of its own.
concurrency:
  group: sdk-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Everything that can refuse a release does so here, before anything is built.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      name: ${{ steps.package.outputs.name }}
      directory: ${{ steps.package.outputs.directory }}
      version: ${{ steps.package.outputs.version }}
      registry: ${{ steps.package.outputs.registry }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The tag, or the one typed for a dry run, names the package and the
      # version before anything else reads it. python is the only name that
      # goes to PyPI, and PEP 440 spells a candidate `0.1.0rc1`.
      - name: Work out the package, its version and its registry
        id: package
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          shape='^(oidc|react|bff|next|node|admin-client|me-client|mcp-stdio|python)-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?)$'
          if [[ ! "$TAG" =~ $shape ]]; then
            echo "::error::$TAG is not an SDK tag: use <name>-vMAJOR.MINOR.PATCH or -rc.N, where name is oidc, react, bff, next, node, admin-client, me-client, mcp-stdio or python."
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          directory="sdks/$name"
          if [ ! -d "$directory" ]; then
            echo "::error::$TAG names $directory, which does not exist."
            exit 1
          fi
          registry=npm
          if [ "$name" = python ]; then registry=pypi; fi
          prerelease=false
          if [[ "$version" == *-rc.* ]]; then prerelease=true; fi
          {
            echo "name=$name"
            echo "directory=$directory"
            echo "version=$version"
            echo "registry=$registry"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # What the tag says must be what would be published, and a package still
      # marked private is not ready to be.
      - name: Require the package to match the tag
        env:
          NAME: ${{ steps.package.outputs.name }}
          DIRECTORY: ${{ steps.package.outputs.directory }}
          VERSION: ${{ steps.package.outputs.version }}
          REGISTRY: ${{ steps.package.outputs.registry }}
        run: |
          if [ "$REGISTRY" = npm ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const [directory, name, version] = process.argv.slice(1);
              const manifest = JSON.parse(readFileSync(`${directory}/package.json`, "utf8"));
              const problems = [];
              if (manifest.name !== `@odudu-io/${name}`) problems.push(`name is ${manifest.name}, expected @odudu-io/${name}`);
              if (manifest.version !== version) problems.push(`version is ${manifest.version}, the tag says ${version}`);
              if (manifest.private === true) problems.push("the package is still private");
              if (problems.length > 0) { console.error(`::error::${directory}/package.json: ${problems.join("; ")}`); process.exit(1); }
            ' "$DIRECTORY" "$NAME" "$VERSION"
          else
            python3 -I - "$DIRECTORY" "$VERSION" <<'PY'
          import sys, tomllib
          directory, version = sys.argv[1:]
          with open(f"{directory}/pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          expected = version.replace("-rc.", "rc")
          problems = []
          if project.get("name") != "odudu":
              problems.append(f"name is {project.get('name')}, expected odudu")
          if project.get("version") != expected:
              problems.append(f"version is {project.get('version')}, the tag says {expected}")
          if problems:
              print(f"::error::{directory}/pyproject.toml: " + "; ".join(problems))
              sys.exit(1)
          PY
          fi

      - name: Require release notes for this version
        env:
          DIRECTORY: ${{ steps.package.outputs.directory }}
          VERSION: ${{ steps.package.outputs.version }}
        run: node tools/release/src/index.ts notes "$DIRECTORY/CHANGELOG.md" "$VERSION" > /dev/null

      # A stable version must be a commit that went through main. A candidate
      # may be a pull request's head.
      - name: Require a stable tag to point at a commit on main
        if: github.event_name == 'push' && steps.package.outputs.prerelease == 'false'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The stable tag $TAG points at $GITHUB_SHA, which is not on main. Merge the commit to main, then delete the tag and tag the merged commit."
            exit 1
          fi

      # The check `verify` ends in, made by GitHub Actions and not by another app
      # that names a check `gate`. A tag pushed before CI finished fails here:
      # run the workflow again once `gate` is green.
      - name: Require that CI passed on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "gate" and .conclusion == "success" and .app.slug == "github-actions") | .id' | wc -l)"
          if [ "$passed" -lt 1 ]; then
            echo "::error::The gate check has not passed on $GITHUB_SHA. Tag a commit CI has passed on, or run this workflow again when it has."
            exit 1
          fi

  # Builds, tests and packs the one package. It holds no registry credential,
  # so a manual run goes this far and stops. The package's own build and test
  # scripts run when it has them. Its example needs the quick start stack, and
  # the `examples` job of verify.yml has already run it on a commit `gate`
  # passed on, so the release does not start a stack of its own.
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup
        if: needs.prepare.outputs.registry == 'npm'

      - name: Build and test the package
        if: needs.prepare.outputs.registry == 'npm'
        env:
          DIRECTORY: ${{ needs.prepare.outputs.directory }}
        run: |
          # {./dir}... selects the package and what it depends on; ./dir... selects
          # only the package, so an SDK built on another would find no dist.
          pnpm --filter "{./$DIRECTORY}..." --if-present run build
          pnpm --filter "./$DIRECTORY" --if-present run test

      # pnpm rewrites a `workspace:` dependency on another SDK to its version
      # in the tarball; npm would leave it as it is.
      - name: Pack the package
        if: needs.prepare.outputs.registry == 'npm'
        env:
          DIRECTORY: ${{ needs.prepare.outputs.directory }}
        run: |
          mkdir "$RUNNER_TEMP/tarball"
          (cd "$DIRECTORY" && pnpm pack --pack-destination "$RUNNER_TEMP/tarball")
          ls -l "$RUNNER_TEMP/tarball"

      - name: Build and check the Python distributions
        if: needs.prepare.outputs.registry == 'pypi'
        env:
          DIRECTORY: ${{ needs.prepare.outputs.directory }}
          ODUDU_REQUIRE_EXTRAS: '1'
          ODUDU_REQUIRE_FIXTURES: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes -r "$DIRECTORY/requirements-dev.txt"
          if [ -d "$DIRECTORY/tests" ]; then
            "$RUNNER_TEMP/venv/bin/python" -m pip install "./$DIRECTORY"
            "$RUNNER_TEMP/venv/bin/python" -m pytest "$DIRECTORY/tests"
          fi
          "$RUNNER_TEMP/venv/bin/python" -m build --outdir "$RUNNER_TEMP/dist" "$DIRECTORY"
          "$RUNNER_TEMP/venv/bin/python" -m twine check "$RUNNER_TEMP/dist"/*

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ needs.prepare.outputs.registry == 'npm' && format('{0}/tarball', runner.temp) || format('{0}/dist', runner.temp) }}
          if-no-files-found: error
          retention-days: 1

  # Only a pushed tag publishes, and only after the owner approves the
  # `sdk-release` environment. npm trusted publishing is configured per
  # package on npmjs.com against this workflow file and that environment, so
  # no token is used. npm is expected to attach a provenance statement for a
  # public package from a public repository; that has not been observed.
  publish-npm:
    needs: [prepare, build]
    if: github.event_name == 'push' && needs.prepare.outputs.registry == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Trusted publishing needs npm 11.5.1 or later. The npm that ships with
      # Node 24 may be older, so install an exact version (11.21.1, published
      # 2026-10-15) and fail the job if the one that runs is below the minimum.
      - name: Use an npm that can publish by trusted publishing
        run: |
          npm install --global npm@11.21.1
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # A candidate goes to the `rc` dist-tag, so `latest` never moves to one.
      - name: Publish to npm
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          tag=latest
          if [ "$PRERELEASE" = "true" ]; then tag=rc; fi
          # The leading ./ matters: npm reads package/x.tgz as a GitHub shorthand.
          npm publish ./package/*.tgz --access public --tag "$tag"

  # A pending publisher for the project `odudu` makes the first publish create
  # it, and the same publisher serves later ones.
  publish-pypi:
    needs: [prepare, build]
    if: github.event_name == 'push' && needs.prepare.outputs.registry == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
